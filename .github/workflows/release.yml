# Publish a GitHub release on a version tag: the signed jar players get from the updater, its
# manifest and signature, and the committed notes (release-notes/<version>.md) as the body.
#
# Trigger: pushing a tag like `v0.1.0` (prerelease suffixes such as `v0.2.0-beta.3` work too).
# Run `make publish` BEFORE pushing the tag: the jar attached here is the one the backend serves,
# fetched and verified against TrustedKeys.kt (tools/release/fetch-signed.sh). The job builds the
# tag too, but only as a check: two machines never produce the same jar bytes, so a second build
# would give the public download a different hash than the signed one.
#
# Safe to re-run: an existing release for the tag is updated in place, never duplicated, and a
# release only becomes public after its files are attached.
name: Release

on:
  push:
    tags:
      - "v*"
  # Manual run for an existing tag (Actions tab, or `gh workflow run release.yml -f tag=v0.3.1`):
  # repairs or refreshes that release with this branch's version of the job.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.3.1"
        required: true
        type: string

# Needed by `gh release` to write the release.
permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    # Explicit bash gets `-eo pipefail`; the implicit default has no pipefail.
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      # The job's own scripts, from the commit that defines this workflow: on a tag push that is
      # the tag itself, on a manual run the branch it was started from (older tags lack them).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: tools/release

      - name: Resolve version and notes from the tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          version="${tag#v}"
          # Same shape `make bump` accepts. Everything below trusts these two values.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' is not v<major>.<minor>.<patch>[-suffix]"
            exit 1
          fi

          # Fail before the build, not after it.
          notes="release-notes/$version.md"
          if [ ! -s "$notes" ]; then
            echo "::error file=$notes::missing or empty; the release body comes from this file"
            exit 1
          fi

          # The jar is built at the TAG's version (see -Pmod_version below), so the artifact and
          # the fabric.mod.json inside it always match the tag. gradle.properties should still be
          # bumped in the repo: warn rather than fail, so a release never blocks on bookkeeping.
          declared="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [ "$declared" != "$version" ]; then
            echo "::warning file=gradle.properties::mod_version is '$declared' but the tag is '$tag'; building as '$version'. Bump gradle.properties to match."
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          # 26.2 requires Java 25 (jvmToolchain(25) in build.gradle.kts).
          java-version: "25"
          distribution: temurin

      # Read-only on tag runs; .github/workflows/build.yml saves these caches on main.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Fetch and verify the signed release
        id: signed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .release-tools/tools/release/fetch-signed.sh "$VERSION" signed
          echo "dir=signed" >> "$GITHUB_OUTPUT"
          echo "\`soul-$VERSION.jar\` sha256 \`$(sha256sum "signed/soul-$VERSION.jar" | cut -d' ' -f1)\` (signed, as served by the updater)" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Loom's project cache
        uses: actions/cache/restore@v4
        with:
          path: .gradle/loom-cache
          key: loom-project-${{ hashFiles('gradle.properties', 'build.gradle.kts', 'settings.gradle.kts', 'src/main/resources/soul.accesswidener') }}
          restore-keys: loom-project-

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build "-Pmod_version=$VERSION" --no-daemon --stacktrace

      - name: Compare the signed jar with this build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Informational: a different compiler patch level may change class bytes, and that must
          # not block a release that is already live for players.
          if python3 .release-tools/tools/release/compare-jars.py "signed/soul-$VERSION.jar" "build/libs/soul-$VERSION.jar" > compare.txt; then
            echo "Signed jar content matches a fresh build of this tag: $(cat compare.txt)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the signed jar's content differs from a fresh build of this tag; see the job log"
            cat compare.txt
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
          DIR: ${{ steps.signed.outputs.dir }}
        run: |
          # `x.y.z-suffix` tags are the updater's Beta channel; mark them as prereleases.
          prerelease=false
          case "$VERSION" in
            *-*) prerelease=true ;;
          esac

          # Draft first, files second, public last: a visible release always has its jar. A re-run
          # (or a release someone created by hand) is updated instead of duplicated.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES" "--prerelease=$prerelease"
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "$NOTES" "--prerelease=$prerelease"
          fi
          gh release upload "$TAG" --clobber \
            "$DIR/soul-$VERSION.jar" "$DIR/soul-$VERSION.manifest.json" "$DIR/soul-$VERSION.manifest.sig"
          gh release edit "$TAG" --draft=false

          # Prove what the public now sees.
          state="$(gh release view "$TAG" --json isDraft,isPrerelease,assets \
            -q '"\(.isDraft) \(.isPrerelease) \([.assets[].name] | sort | join(","))"')"
          want="false $prerelease soul-$VERSION.jar,soul-$VERSION.manifest.json,soul-$VERSION.manifest.sig"
          if [ "$state" != "$want" ]; then
            echo "::error::release $TAG is '$state', expected '$want'"
            exit 1
          fi
          echo "Published $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"

  # Its own job on purpose: it holds the Modrinth token and runs no build, so no Gradle plugin or
  # dependency ever shares a machine with the token or with the jar being uploaded.
  modrinth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: tools/release

      - name: Fetch, verify and upload the signed release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          # Minecraft versions the jar runs on, space-separated; extend when 26.2.x patches appear.
          MODRINTH_GAME_VERSIONS: "26.2"
        run: |
          version="${TAG#v}"
          MODRINTH_TOKEN= bash .release-tools/tools/release/fetch-signed.sh "$version" signed
          bash .release-tools/tools/release/modrinth-upload.sh "$version" "signed/soul-$version.jar" "release-notes/$version.md" \
            | tee -a "$GITHUB_STEP_SUMMARY"
