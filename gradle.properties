# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# --- Minecraft 26.2 / Fabric toolchain (from Fabric docs base for 26.2) ---
# Required JDK is 25 for 26.2 (NOT 21 like the legacy mod). Use a JBR 25 in IntelliJ.
minecraft_version=26.2
loader_version=0.19.3
fabric_api_version=0.153.0+26.2
fabric_kotlin_version=1.13.12+kotlin.2.4.0
# Loom version is mirrored in build.gradle.kts (plugins block can't read gradle.properties cleanly).
loom_version=1.17-SNAPSHOT

# Kotlin gradle plugin — match the compiler version Fabric Language Kotlin bundles.
kotlin_version=2.4.0

# Mod metadata
mod_version=0.3.2-beta.4
maven_group=com.soulreturns
archives_base_name=soul
