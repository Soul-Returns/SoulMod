name: SoulTestKit
version: 1.0.0
main: com.soulreturns.testkit.SoulTestKit
api-version: "26.2"
description: Imitates Hypixel SkyBlock (mod API packets, sidebar, tab list, action bar, menus, items) for SoulMod tests. Local test server only.
commands:
  hx:
    description: Fake Hypixel SkyBlock state for the SoulMod test client (hx help).
    usage: /hx help
    permission: soultestkit.hx
  party:
    description: Hypixel's /party list answer for the party hx party set; other subcommands are not simulated.
    usage: /party list
  pc:
    description: Party chat as Hypixel echoes it (the player's own Party > line); logged as [pc].
    usage: /pc <text>
permissions:
  soultestkit.hx:
    default: op
